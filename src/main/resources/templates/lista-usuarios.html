<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Gestión de Usuarios</h2>
<a href="/web/usuarios/nuevo" class="btn btn-primary mb-3">Registrar Nuevo Usuario</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Nombre Completo</th>
        <th>Email</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${usuarios}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.username}">admin</td>
        <td th:text="${user.nombreCompleto}">Admin</td>
        <td th:text="${user.email}">admin@test.com</td>
        <td>
                    <span th:class="${user.activo ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${user.activo ? 'Activo' : 'Inactivo'}"></span>
        </td>
        <td>
            <a th:href="@{/web/usuarios/estado/{id}(id=${user.id})}"
               class="btn btn-sm btn-warning">Activar/Desactivar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
